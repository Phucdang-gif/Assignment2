name: BrewLite CD Pipeline (Continuous Delivery & Deployment)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub Actions để test

permissions:
  contents: read
  packages: write # Quyền đóng gói và đẩy Docker image lên GitHub Container Registry (GHCR)

jobs:
  # ============================================================
  # CHẶNG 1: QUALITY GATE (Kiểm tra Lint, Test và Build mã nguồn)
  # ============================================================
  quality-gate:
    name: 1. Quality Gates (Lint, Test & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite123
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      # 1.1 Backend Quality Check
      - name: Install Backend Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Backend Lint
        working-directory: apps/api
        run: npm run lint

      - name: Backend Prisma Migrations (Test DB)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite123@localhost:5432/brewlite_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Database (Test DB)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite123@localhost:5432/brewlite_test?schema=public
        run: node prisma/seed.js

      - name: Run Backend Unit Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite123@localhost:5432/brewlite_test?schema=public
          JWT_SECRET: ci-test-secret-key
          PORT: 3001
        run: npm test -- --passWithNoTests

      - name: Run Backend Integration & E2E Tests (Task 5.2)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite123@localhost:5432/brewlite_test?schema=public
          JWT_SECRET: ci-test-secret-key
          PORT: 3001
        run: npm run test:e2e

      - name: Build Backend Application
        working-directory: apps/api
        run: npm run build

      # 1.2 Frontend Quality Check
      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend Lint
        working-directory: apps/web
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: Validate Production Secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_API_URL }}" ]; then
            echo "::error::Thiếu secret PRODUCTION_API_URL! Frontend Next.js build bắt buộc cần API URL để cấu hình."
            exit 1
          fi
          echo "✅ PRODUCTION_API_URL đã được cấu hình: ${{ secrets.PRODUCTION_API_URL }}"

      - name: Build Frontend Application
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: npm run build

  # ============================================================
  # CHẶNG 2: ĐÓNG GÓI DOCKER IMAGE & PUSH LÊN CONTAINER REGISTRY (GHCR)
  # ============================================================
  docker-build-push:
    name: 2. Docker Packaging & Push to Registry
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/brewlite-api
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # CHẶNG 3: KÍCH HOẠT TRIỂN KHAI PRODUCTION (RENDER API / HOOK)
  # ============================================================
  deploy-production:
    name: 3. Trigger Render Production Deploy
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy on Render Cloud
        run: |
          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            IMAGE_TAG="ghcr.io/${{ github.repository }}/brewlite-api:${{ github.sha }}"
            echo "🚀 Triển khai qua Render API với Image: $IMAGE_TAG"
            DEPLOY_RES=$(curl -s -o deploy_res.json -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -d "{\"imageUrl\": \"$IMAGE_TAG\"}")
            echo "Render API Response Code: $DEPLOY_RES"
            cat deploy_res.json || true
            if [ "$DEPLOY_RES" -eq 200 ] || [ "$DEPLOY_RES" -eq 201 ]; then
              echo "✅ Đã kích hoạt deploy Image $IMAGE_TAG thành công qua Render API!"
            else
              echo "::error::Gọi Render API deploy thất bại (HTTP $DEPLOY_RES)"
              exit 1
            fi
          elif [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "🚀 Kích hoạt triển khai qua Render Deploy Hook..."
            HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
            echo "Response code: $HTTP_RESPONSE"
            cat response.txt || true
            if [ "$HTTP_RESPONSE" -ne 200 ] && [ "$HTTP_RESPONSE" -ne 201 ]; then
              echo "::error::Deploy trigger failed with HTTP status $HTTP_RESPONSE"
              exit 1
            fi
            echo "✅ Deployment triggered on Render successfully!"
          else
            echo "::error::Thiếu cả RENDER_API_KEY lẫn RENDER_DEPLOY_HOOK. Không thể kích hoạt deploy!"
            exit 1
          fi

  # ============================================================
  # CHẶNG 4: SMOKE TEST / HEALTH CHECK & AUTO ROLLBACK ALERT
  # ============================================================
  smoke-test:
    name: 4. Smoke Test & Health Check
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloud Container to start up
        run: |
          echo "Waiting 45 seconds for Render to deploy and start container..."
          sleep 45

      - name: Run Smoke Test on Production Endpoint
        id: health_check
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health"
          echo "🔍 1. Pinging Health Check: $HEALTH_URL"
          
          # Retry tối đa 6 lần, mỗi lần cách nhau 15 giây
          PASSED=0
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o res.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: Received HTTP Status $HTTP_CODE from $HEALTH_URL"
            if [ "$HTTP_CODE" -eq 200 ]; then
              cat res.json
              echo ""
              echo "✅ Health check PASSED with status 200 OK!"
              PASSED=1
              break
            fi
            sleep 15
          done
          
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::Smoke test FAILED! Service at $HEALTH_URL did not respond 200 OK."
            exit 1
          fi

          echo "🔍 2. Kiểm tra truy vấn CSDL qua API nghiệp vụ (Products)"
          PRODUCTS_URL="${{ secrets.PRODUCTION_API_URL }}/api/products"
          PROD_CODE=$(curl -s -o prod_res.json -w "%{http_code}" "$PRODUCTS_URL" || true)
          echo "Endpoint $PRODUCTS_URL trả về HTTP Status: $PROD_CODE"
          
          if [ "$PROD_CODE" -ne 200 ]; then
            PRODUCTS_URL="${{ secrets.PRODUCTION_API_URL }}/products"
            PROD_CODE=$(curl -s -o prod_res.json -w "%{http_code}" "$PRODUCTS_URL" || true)
            echo "Fallback endpoint $PRODUCTS_URL trả về HTTP Status: $PROD_CODE"
          fi

          if [ "$PROD_CODE" -eq 200 ]; then
            echo "✅ CSDL đã kết nối thành công và dữ liệu sản phẩm phản hồi 200 OK!"
          else
            echo "::error::Truy vấn dữ liệu sản phẩm thất bại với mã HTTP $PROD_CODE!"
            exit 1
          fi

          # 3. Kiểm tra Frontend nếu có cấu hình PRODUCTION_WEB_URL
          if [ -n "${{ secrets.PRODUCTION_WEB_URL }}" ]; then
            echo "🔍 3. Kiểm tra Frontend Production: ${{ secrets.PRODUCTION_WEB_URL }}"
            WEB_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_WEB_URL }}" || true)
            echo "Frontend HTTP Status: $WEB_CODE"
            if [ "$WEB_CODE" -ge 200 ] && [ "$WEB_CODE" -lt 400 ]; then
              echo "✅ Frontend Production phản hồi tốt ($WEB_CODE)!"
            else
              echo "::warning::Frontend phản hồi mã $WEB_CODE"
            fi
          fi

      - name: Automated Rollback and Failure Guidance
        if: failure()
        run: |
          echo "::error::DEPLOYMENT FAILURE: Smoke test failed on Production endpoint ($HEALTH_URL)!"
          echo "================================================================================"
          echo "🚨 KÍCH HOẠT QUY TRÌNH ROLLBACK & PHỤC HỒI DỊCH VỤ SẢN XUẤT (DISASTER RECOVERY)"
          echo "================================================================================"
          
          # Kiểm tra nếu có API Token và Service ID thì tự động trigger Render Rollback API
          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "⚡ Phát hiện RENDER_API_KEY. Đang kích hoạt Automated Rollback qua Render REST API..."
            ROLLBACK_RESPONSE=$(curl -s -o rollback_res.txt -w "%{http_code}" \
              -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/rollback" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
            echo "Render Rollback API HTTP Status: $ROLLBACK_RESPONSE"
            cat rollback_res.txt || true
            if [ "$ROLLBACK_RESPONSE" -eq 200 ] || [ "$ROLLBACK_RESPONSE" -eq 201 ]; then
              echo "✅ ĐÃ KÍCH HOẠT ROLLBACK TỰ ĐỘNG THÀNH CÔNG VỀ BẢN BUILD TRƯỚC ĐÓ TRÊN RENDER!"
            else
              echo "⚠️ Tự động rollback qua API chưa hoàn tất (Status $ROLLBACK_RESPONSE). Yêu cầu rollback qua Dashboard."
            fi
          else
            echo "ℹ️ Chưa thiết lập RENDER_API_KEY. Tiến hành hướng dẫn quy trình Rollback chuẩn (SOP):"
            echo "1. Render Cloud đã kích hoạt Zero-Downtime Deployment: Nếu container mới không vượt qua /health,"
            echo "   Render sẽ tạm hoãn chuyển lưu lượng và giữ container phiên bản trước đó hoạt động."
            echo "2. Để Rollback triệt để trên Render Dashboard:"
            echo "   a. Truy cập: https://dashboard.render.com"
            echo "   b. Chọn Web Service 'brewlite-api' -> mục 'Events' hoặc 'Deploys'."
            echo "   c. Chọn bản deploy thành công gần nhất trước đó (Last Successful Deploy) -> nhấn 'Rollback to this deploy'."
            echo "3. Để Rollback mã nguồn qua Git Version Control:"
            echo "   a. git revert HEAD (hoặc git revert <commit-sha-loi>)"
            echo "   b. git tag -d <release-tag> && git push origin :refs/tags/<release-tag>"
            echo "   c. Tạo và đẩy tag mới: git tag vX.Y.Z-rollback && git push origin vX.Y.Z-rollback"
            echo "4. Chi tiết xem tại tài liệu: docs/deployment.md (Mục 7: Chiến lược Rollback & Khôi phục sự cố)"
          fi
          echo "================================================================================"
          exit 1
