name: assignment2

services:
  db:
    image: postgres:16-alpine
    container_name: assignment2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123
      POSTGRES_DB: brewlite
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/database local/brewlite_schema.sql:/docker-entrypoint-initdb.d/brewlite_schema.sql:ro
      - ./apps/api/prisma/database local/brewlite_seed_data.sql:/docker-entrypoint-initdb.d/brewlite_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: brewlite-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite123@db:5432/brewlite?schema=public
      JWT_SECRET: brewlite-super-secret-key-change-in-production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    container_name: brewlite-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  pgdata:
